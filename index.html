    const cash = avantImpot - impot;
    cum += cash;
    const valeur = valeur0 * Math.pow(1 + S.appreciation / 100, y);
    const fv = valeur * S.fraisVente / 100;
    const crdY = sched[y - 1].crd;
    const ipv = plusValueTax(valeur - fv, price, notaire, travaux, y, regime === 'lmnp_reel' ? amortCumul : 0, S.ps);
    const netVente = valeur - fv - crdY - ipv;
    rows.push({y, enc, opex, credit, interets, impot, avantImpot, cash, cum, valeur, crd: crdY, ipv, netVente, position: cum + netVente - apport});
  }
  let rentable = null, prev = position0;
  if (position0 >= 0) rentable = 0;
  else for (const r of rows) {
    if (r.position >= 0) { const f = r.position - prev ? -prev / (r.position - prev) : 0; rentable = r.y - 1 + clamp(f, 0, 1); break; }
    prev = r.position;
  }
  const cashPos = rows.find(r => r.cash >= 0);
  let tri = null;
  if (apport >= 1000) {
    const flows = [-apport].concat(rows.slice(0, 20).map(r => r.cash));
    flows[20] += rows[19].netVente;
    tri = irr(flows);
  }
  return {
    regime, notaire, travaux, mobilier, coutTotal, apport, emprunt, fraisBancaires, coutProjet, mensualite, assuranceM,
    loyerAn, vac, fixes, opexY1,
    rendBrut: price > 0 ? loyerAn / price : 0,
    rendNet: coutProjet > 0 ? (encY1 - opexY1) / coutProjet : 0,
    rows, position0, rentable, tri,
    cashMensuel: rows[0].cash / 12, cashAvantImpotM: rows[0].avantImpot / 12, impotY1: rows[0].impot,
    cashPositifAn: cashPos ? cashPos.y : null,
    gain10: rows[9].position, gain20: rows[19].position, valeur10: rows[9].valeur
  };
}

function analyze(raw, S, M) {
  const city = findCity(raw, M);
  const o = normalize(raw, city);
  const pref = o.meuble ? S.regimeMeuble : S.regimeNu;
  let cands = o.meuble ? ['lmnp_reel', 'micro_bic'] : ['reel_foncier', 'micro_foncier'];
  if (o.meuble && o.loyer * 12 > 77700) cands = ['lmnp_reel'];
  if (!o.meuble && o.loyer * 12 > 15000) cands = ['reel_foncier'];
  let r;
  if (pref === 'auto' || !REGIMES[pref]) {
    r = cands.map(c => simulate(o, city, S, c)).sort((a, b) => b.gain10 - a.gain10)[0];
    r.regimeAuto = true;
  } else r = simulate(o, city, S, pref);
  r.o = o; r.city = city;
  r.prixM2 = o.surface > 0 ? o.prix / o.surface : null;
  r.ecartMarche = city && r.prixM2 ? r.prixM2 / city.prixM2 - 1 : null;
  r.loyerMarche = estimateRent(o.surface, city, o.meuble, o.type);
  r.endettement = S.revenus > 0 ? (r.mensualite + r.assuranceM + (S.autresCredits || 0)) / (S.revenus + 0.7 * o.loyer) : null;
  r.risks = buildRisks(o, r, city, S);
  r.defauts = detectDefects(o);
  r.score = scoreOf(r);
  r.atouts = atouts(r);
  return r;
}

function buildRisks(o, r, city, S) {
  const R = [];
  const add = (niveau, titre, texte) => R.push({niveau, titre, texte});
  const s = o.surface;
  if (o.dpe === 'G') add('critique', 'Location interdite (DPE G)', `Depuis le 1er janvier 2025, un logement classé G ne peut plus être loué pour un nouveau bail ou un renouvellement, et son loyer est gelé. Rénovation à prévoir : environ ${eurK(s * 300)} à ${eurK(s * 550)}.`);
  else if (o.dpe === 'F') add('critique', 'Interdit à la location en 2028 (DPE F)', `Les logements F seront interdits à la location au 1er janvier 2028 et leur loyer est déjà gelé. Budget rénovation : environ ${eurK(s * 250)} à ${eurK(s * 450)}. Négocie le prix en conséquence.`);
  else if (o.dpe === 'E') add('attention', 'Interdit à la location en 2034 (DPE E)', `Les logements E seront interdits à la location au 1er janvier 2034. Prévois l'isolation ou le changement de chauffage d'ici là : environ ${eurK(s * 150)} à ${eurK(s * 300)}.`);
  else if (!o.dpe) add('attention', 'DPE inconnu', "Demande le diagnostic de performance énergétique : un F ou un G change tout (gel des loyers, interdiction de louer, travaux).");
  if (s > 0 && s < 9) add('critique', 'Surface non décente', 'Moins de 9 m² : le logement ne peut pas être loué comme résidence principale.');
  if (r.endettement != null && r.endettement > 0.35) add('critique', 'Financement difficile', `Ton taux d'endettement serait de ${pct(r.endettement, 0)}, au-dessus de la limite de 35 % appliquée par les banques.`);
  if (r.rentable == null) add('critique', 'Pas rentable sur 30 ans', "Avec ces hypothèses, revendre ne rapporte jamais plus que ce que tu as investi. Revois le prix, le loyer ou le financement.");
  else if (r.rentable > 15) add('attention', 'Rentabilité lente', `Il faut environ ${duree(r.rentable)} avant qu'une revente te rapporte plus que ce que tu as mis.`);
  if (r.cashMensuel < -300) add('critique', "Gros effort d'épargne", `Il faudrait ajouter environ ${eur(-r.cashMensuel)} par mois de ta poche la première année (après impôts).`);
  else if (r.cashMensuel < 0) add('attention', 'Cashflow négatif', `Environ ${eur(-r.cashMensuel)} par mois à compléter de ta poche la première année (après impôts).`);
  if (r.ecartMarche != null && r.ecartMarche > 0.10) add('attention', 'Prix au-dessus du marché', `${sPct(r.ecartMarche)} par rapport au prix moyen au m² de ${city.nom}. La marge de négociation est probablement réelle.`);
  if (r.rendBrut > 0 && r.rendBrut < 0.045) add('attention', 'Rendement faible', "Moins de 4,5 % brut : le gain dépend surtout d'une hausse des prix, qui n'est pas garantie.");
  if (city && city.encadrement && r.loyerMarche > 0 && o.loyer > r.loyerMarche * 1.25) add('attention', 'Encadrement des loyers', `${city.nom} applique l'encadrement des loyers. ${eur(o.loyer)} pour ${s} m² semble élevé : vérifie le loyer plafond sur le simulateur officiel avant d'acheter.`);
  if (city && city.tension === 'faible') add('attention', 'Marché locatif peu tendu', `À ${city.nom}, trouver un locataire peut prendre plus de temps. Prévois plus de vacance et soigne la présentation du logement.`);
  if (s > 0 && o.charges / s > 45) add('attention', 'Charges de copropriété élevées', `${eur(o.charges)} par an, soit ${nf0.format(o.charges / s)} €/m². Cela peut signaler un immeuble coûteux (chauffage collectif, ascenseur, gardien) ou des travaux en cours.`);
  if (o.loyer > 0 && o.taxeFonciere > o.loyer * 1.5) add('attention', 'Taxe foncière lourde', "Elle représente plus d'un mois et demi de loyer chaque année, et elle augmente régulièrement.");
  if (o.travaux > o.prix * 0.15) add('attention', 'Gros travaux', "Les chantiers dépassent souvent leur budget de 20 à 30 %. Fais chiffrer par deux artisans avant de signer.");
  if (city && city.tendance <= -1.5) add('info', 'Prix en baisse dans la ville', `${sPct(city.tendance / 100, 1)} sur un an à ${city.nom}. Bon pour négocier, mais la plus-value à court terme est incertaine.`);
  if (o.annee && o.annee < 1949) add('info', 'Immeuble ancien (avant 1949)', 'Vérifie le constat plomb, la toiture, les réseaux et le ravalement : de gros travaux de copropriété sont possibles.');
  else if (o.annee && o.annee < 1997) add('info', 'Construit avant 1997', "Le diagnostic amiante est obligatoire. Regarde le plan pluriannuel de travaux de la copropriété.");
  if (s >= 9 && s < 20) add('info', 'Petite surface', 'Les locataires changent plus souvent : prévois des frais de remise en état et un peu plus de vacance.');
  if (r.regime === 'micro_foncier' && S.tmi >= 30) add('info', 'Fiscalité lourde', `Au micro-foncier avec une tranche à ${S.tmi} %, l'impôt pèse beaucoup. La location meublée (LMNP) réduit souvent l'impôt à zéro pendant des années.`);
  if (r.regime === 'lmnp_reel') add('info', 'Amortissements et revente', "Depuis 2025, les amortissements déduits en LMNP sont ajoutés à la plus-value lors de la revente. HomeIme en tient compte.");
  if (o.meuble) add('info', 'Mobilier', 'Le mobilier est à renouveler tous les 7 à 10 ans, et la liste du mobilier obligatoire doit être respectée.');
  if (o.type === 'maison') {
    add('info', 'Maison : tout est à ta charge', `Pas de copropriété pour partager les frais : toiture, façade, réseaux et extérieurs sont pour toi. HomeIme prévoit un entretien plus élevé (${String(S.entretien + 3).replace('.', ',')} % des loyers) et une assurance plus chère.`);
    add('info', 'Terrain et assainissement', 'Vérifie le raccordement au tout-à-l’égout, le retrait-gonflement des argiles et les risques naturels sur Géorisques.');
  }
  const order = {critique: 0, attention: 1, info: 2};
  return R.sort((a, b) => order[a.niveau] - order[b.niveau]);
}

function scoreOf(r) {
  const lin = (x, a, b, max) => clamp((x - a) / (b - a), 0, 1) * max;
  let s = lin(r.rendNet * 100, 2, 7, 30)
    + lin(r.cashMensuel, -400, 150, 20)
    + (r.ecartMarche == null ? 10 : lin(-r.ecartMarche * 100, -20, 20, 20))
    + (r.rentable == null ? 0 : lin(-r.rentable, -20, -4, 15));
  const all = r.risks.concat(r.defauts || []);
  const crit = all.filter(x => x.niveau === 'critique').length, att = all.filter(x => x.niveau === 'attention').length;
  s += Math.max(0, 15 - crit * 8 - att * 3);
  return Math.round(clamp(s, 0, 100));
}
function atouts(r) {
  const a = [];
  if (r.ecartMarche != null && r.ecartMarche < -0.05) a.push(`Prix ${pct(-r.ecartMarche, 0)} sous le marché`);
  if (r.rendNet >= 0.05) a.push(`Rendement net ${pct(r.rendNet)}`);
  if (r.cashMensuel >= 0) a.push('Se finance seul');
  if (r.rentable != null && r.rentable <= 6) a.push(`Rentable en ${duree(r.rentable)}`);
  if (/[ABC]/.test(r.o.dpe || '')) a.push(`Bon DPE (${r.o.dpe})`);
  return a;
}
const verdict = s => s >= 75 ? 'Excellente' : s >= 60 ? 'Bonne' : s >= 45 ? 'Correcte' : 'Risquée';
const ringCls = s => s >= 75 ? 'good' : s >= 60 ? 'ok' : s >= 45 ? 'warn' : 'bad';

/* ---------- État ---------- */
const LS_KEY = 'homeime.v1';
const state = {
  offers: [], settings: Object.assign({}, DEFAULT_SETTINGS), criteria: Object.assign({}, DEFAULT_CRITERIA),
  market: MARKET_DEFAULT, mode: 'connecting', loaded: false, syncNote: '', veille: null,
  route: {view: 'offres', id: null}, sort: 'score',
  draft: null, editingId: null, confirm: null, ai: {}, aiAvailable: false, imgAvailable: false, importFile: null
};
let db = null, sample = null;

function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
function lsWrite() {
  try {
    const data = {settings: state.settings, criteria: state.criteria};
    if (state.mode === 'local') data.offers = state.offers;
    else { const prev = lsRead(); if (prev && prev.offers) data.offers = prev.offers; }
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch (e) {}
}
(function boot() {
  const saved = lsRead();
  if (saved) {
    if (saved.settings) state.settings = Object.assign({}, DEFAULT_SETTINGS, saved.settings);
    if (saved.criteria) state.criteria = Object.assign({}, DEFAULT_CRITERIA, saved.criteria);
  }
})();

const clean = o => JSON.parse(JSON.stringify(o));
function writeErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return "Tu n'as pas le droit de modifier ces données.";
  if (c === 'quota_exceeded') return 'Stockage plein : supprime quelques offres.';
  if (c === 'resource_exhausted') return 'Trop de modifications d’un coup. Réessaie dans un instant.';
  return 'Enregistrement impossible pour le moment. Réessaie.';
}
async function saveOffer(o) {
  o.updatedAt = new Date().toISOString();
  if (state.mode === 'db' && db) {
    try { await db.collection('offers').doc(o.id).set(clean(o)); return true; }
    catch (e) { toast(writeErr(e)); return false; }
  }
  const i = state.offers.findIndex(x => x.id === o.id);
  if (i >= 0) state.offers[i] = o; else state.offers.push(o);
  lsWrite(); return true;
}
async function removeOffer(id) {
  if (state.mode === 'db' && db) {
    try { await db.collection('offers').doc(id).delete(); return true; }
    catch (e) { toast(writeErr(e)); return false; }
  }
  state.offers = state.offers.filter(x => x.id !== id); lsWrite(); return true;
}
const timers = {};
function queueSave(kind) {
  clearTimeout(timers[kind]);
  timers[kind] = setTimeout(async () => {
    lsWrite();
    if (state.mode === 'db' && db) {
      try { await db.doc(kind === 'settings' ? 'config/reglages' : 'config/criteres').set(clean(kind === 'settings' ? state.settings : state.criteria)); }
      catch (e) { toast(writeErr(e)); }
    }
  }, 700);
}

async function connect() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { goLocal(); return; }
  C.use('sample').then(s => {
    if (!s) return;
    sample = s; state.aiAvailable = true;
    s.limits().then(l => { state.imgAvailable = !!(l && l.images); render(); }).catch(() => render());
  }).catch(() => {});
  let d = null;
  try { d = await C.use('db'); } catch (e) { d = null; }
  if (!d) { goLocal(); return; }
  // Seul le propriétaire utilise la base partagée ; un proche qui ouvre le lien garde ses offres sur son appareil.
  let owner = false;
  try { const u = await C.use('user'); owner = !!(u && await u.isOwner()); } catch (e) {}
  if (!owner) {
    try {
      const probe = await Promise.race([d.doc('config/veille').get(), new Promise(res => setTimeout(() => res(null), 8000))]);
      owner = !!(probe && probe.exists);
    } catch (e) {}
  }
  if (!owner) { goLocal(); d.doc('config/marche').onSnapshot(onMarket, () => {}); return; }
  db = d; state.mode = 'db'; render();
  C.use('assets').then(a => { state.assetsApi = a || null; if (a && state.route.view === 'analyser') render(); }).catch(() => {});
  const timer = setTimeout(() => { if (!state.loaded) { state.syncNote = 'La connexion est lente : les données affichées peuvent dater.'; render(); } }, 10000);
  db.collection('offers').onSnapshot(snap => {
    state.offers = snap.docs.map(x => Object.assign({}, x.data(), {id: x.id}));
    if (!snap.metadata.fromCache) { state.loaded = true; state.syncNote = ''; clearTimeout(timer); }
    state.lastSync = new Date();
    render();
  }, () => { clearTimeout(timer); state.loaded = true; state.syncNote = 'Synchronisation interrompue. Recharge la page pour réessayer.'; render(); });
  db.doc('config/reglages').onSnapshot(s => { if (s.exists) { state.settings = Object.assign({}, DEFAULT_SETTINGS, s.data()); render(); } }, () => {});
  db.doc('config/criteres').onSnapshot(s => { if (s.exists) { state.criteria = Object.assign({}, DEFAULT_CRITERIA, s.data()); render(); } }, () => {});
  db.doc('config/veille').onSnapshot(s => { state.veille = s.exists ? s.data() : null; render(); }, () => {});
  db.doc('config/marche').onSnapshot(onMarket, () => {});
}
function onMarket(s) {
  if (!s.exists) return;
  const m = s.data();
  if (m && Array.isArray(m.villes) && m.villes.length && String(m.updatedAt || '') >= MARKET_DEFAULT.updatedAt) { state.market = Object.assign({}, MARKET_DEFAULT, m); render(); }
}
function goLocal() {
  state.mode = 'local'; state.loaded = true;
  const saved = lsRead();
  state.offers = (saved && Array.isArray(saved.offers)) ? saved.offers : [];
  render();
}

/* ---------- Rendu ---------- */
function ring(score, size = 54, big = false) {
  const r = (size - 6) / 2, c = 2 * Math.PI * r, off = c * (1 - score / 100), h = size / 2;
  return `<div class="ring ring-${ringCls(score)}${big ? ' big' : ''}" style="width:${size}px;height:${size}px" aria-label="Score ${score} sur 100"><svg viewBox="0 0 ${size} ${size}"><circle class="ring-bg" cx="${h}" cy="${h}" r="${r}"/><circle class="ring-fg" cx="${h}" cy="${h}" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${h} ${h})"/></svg><span>${score}</span></div>`;
}
const dpeBadge = d => d ? `<span class="dpe dpe-${d}" title="DPE ${d}">${d}</span>` : `<span class="dpe dpe-x" title="DPE inconnu">?</span>`;
const cityName = r => r.city ? r.city.nom : (r.o.villeNom || 'Ville ?');
const cashCls = v => v >= 0 ? 'good-t' : v > -150 ? 'warn-t' : 'bad-t';
function riskPills(r) {
  const c = r.risks.filter(x => x.niveau === 'critique').length, a = r.risks.filter(x => x.niveau === 'attention').length;
  let h = '';
  if (c) h += `<span class="pill bad">${c} critique${c > 1 ? 's' : ''}</span>`;
  if (a) h += `<span class="pill warn">${a} à surveiller</span>`;
  const d = (r.defauts || []).filter(x => x.niveau !== 'info');
  if (d.length) h += `<span class="pill bad">Défauts : ${esc(d.slice(0, 2).map(x => x.titre.toLowerCase()).join(', '))}${d.length > 2 ? ' +' + (d.length - 2) : ''}</span>`;
  if (!c && !a && !d.length) h += `<span class="pill good">Pas de risque majeur</span>`;
  return h;
}
function matchesCriteria(r) {
  const C = state.criteria, R = C.regions || [], V = C.villes || [];
  if (C.typeBien && C.typeBien !== 'tous' && r.o.type !== C.typeBien) return false;
  if (C.surfaceMin && r.o.surface < C.surfaceMin) return false;
  if (R.length || V.length) {
    const reg = r.o.region || cityRegion(r.city);
    const inV = !!(r.city && V.includes(r.city.id)), inR = !!(reg && R.includes(reg));
    if (!inV && !inR) return false;
  }
  if (C.budgetMax && r.o.prix > C.budgetMax) return false;
  if (C.rendementMin && r.rendBrut * 100 < C.rendementMin) return false;
  return true;
}

function analyses() { return state.offers.map(o => analyze(o, state.settings, state.market)); }

function veilleLine() {

function chartSVG(r) {
  const N = 25;
  const pts = [{y: 0, v: r.position0}].concat(r.rows.slice(0, N).map(x => ({y: x.y, v: x.position})));
  const W = 340, Hh = 180, L = 46, R = 12, T = 14, B = 24;
  const vals = pts.map(p => p.v);
  let mn = Math.min(0, ...vals), mx = Math.max(0, ...vals);
  const span = mx - mn || 1, raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), nn = raw / mag;
  const step = (nn <= 1 ? 1 : nn <= 2 ? 2 : nn <= 2.5 ? 2.5 : nn <= 5 ? 5 : 10) * mag;
  mn = Math.floor(mn / step) * step; mx = Math.ceil(mx / step) * step;
  const X = y => L + y / N * (W - L - R), Y = v => T + (mx - v) / (mx - mn) * (Hh - T - B);
  let grid = '';
  for (let v = mn; v <= mx + step / 2; v += step) {
    grid += `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ch-txt" x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${esc(sEurK(v))}</text>`;
  }
  let xl = '';
  for (let y = 0; y <= N; y += 5) xl += `<text class="ch-txt" x="${X(y).toFixed(1)}" y="${Hh - 6}" text-anchor="${y === 0 ? 'start' : y === N ? 'end' : 'middle'}">${y === 0 ? 'Achat' : y + ' ans'}</text>`;
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.y).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = line + ` L${X(N).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const z = Y(0).toFixed(1);
  let mark = '';
  if (r.rentable != null && r.rentable <= N) {
    const mxp = X(r.rentable);
    mark = `<circle class="ch-pt" cx="${mxp.toFixed(1)}" cy="${z}" r="5"/><text class="ch-lab" x="${clamp(mxp, L + 30, W - R - 30).toFixed(1)}" y="${(Y(0) - 10).toFixed(1)}" text-anchor="middle">Rentable</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gain net si tu revends, année après année">
    <defs><clipPath id="cp-pos"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath><clipPath id="cp-neg"><rect x="0" y="${z}" width="${W}" height="${Hh}"/></clipPath></defs>
    ${grid}
    <path class="ch-pos" d="${area}" clip-path="url(#cp-pos)"/>
    <path class="ch-neg" d="${area}" clip-path="url(#cp-neg)"/>
    <line class="ch-zero" x1="${L}" x2="${W - R}" y1="${z}" y2="${z}"/>
    <path class="ch-line" d="${line}"/>
    ${mark}${xl}
  </svg>`;
}

const EMPTY_DRAFT = {photo: '', photoCredit: '', type: '', titre: '', ville: '', villeNom: '', region: '', prix: '', surface: '', pieces: '', dpe: '', meuble: false, loyer: '', charges: '', taxeFonciere: '', travaux: '', annee: '', lien: '', defauts: '', notes: ''};
function draftFromOffer(o) {
  const d = Object.assign({}, EMPTY_DRAFT);
  for (const k of Object.keys(EMPTY_DRAFT)) if (o[k] != null) d[k] = typeof EMPTY_DRAFT[k] === 'boolean' ? !!o[k] : Array.isArray(o[k]) ? o[k].join('\n') : String(o[k]);
  if (!d.type) d.type = inferType(o.titre);
  if (!d.ville && o.villeNom) { const c = findCity(o, state.market); d.ville = c ? c.id : 'autre'; }
  return d;
}
const photoPreviewHTML = d => safePhoto(d.photo) ? `<img class="ph" src="${esc(safePhoto(d.photo))}" alt="Photo du bien" referrerpolicy="no-referrer"><button type="button" class="inline-btn" data-action="remove-photo">Retirer la photo</button>` : '';
const splitLines = s => String(s || '').split(/\n|;/).map(x => x.trim()).filter(Boolean).slice(0, 12).map(x => x.slice(0, 120));
function ensureDraft() {
  if (!state.draft) {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('homeime.draft') || 'null'); } catch (e) {}
    state.draft = saved && saved.d ? saved.d : Object.assign({}, EMPTY_DRAFT);
    state.editingId = saved && saved.id ? saved.id : null;
  }
  return state.draft;
}
function persistDraft() { try { sessionStorage.setItem('homeime.draft', JSON.stringify({d: state.draft, id: state.editingId})); } catch (e) {} }
function draftOffer(d) {
  return {id: state.editingId || 'draft', type: d.type, defauts: splitLines(d.defauts), notes: d.notes, titre: d.titre, ville: d.ville && d.ville !== 'autre' ? d.ville : '', villeNom: d.ville === 'autre' ? d.villeNom : '', region: d.ville === 'autre' ? d.region : '',
    prix: d.prix, surface: d.surface, dpe: d.dpe, meuble: d.meuble, loyer: d.loyer, charges: d.charges, taxeFonciere: d.taxeFonciere, travaux: d.travaux, annee: d.annee};
}

/* ---------- Claude ---------- */
function aiErr(e) {
  const c = e && e.code;
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { state.aiAvailable = false; return 'Claude n’est pas disponible ici.'; }
  if (c === 'rate_limited') return 'Trop de demandes pour le moment. Réessaie dans quelques minutes.';
  if (c === 'session_expired') return 'Reconnecte-toi à Claude, puis réessaie.';
  if (c === 'image_rejected') return 'Image refusée : essaie une capture en JPEG ou PNG.';
  if (c === 'images_unavailable') { state.imgAvailable = false; return 'Les captures ne sont pas disponibles ici : colle plutôt le texte.'; }
  if (c === 'invalid_json' || c === 'empty_completion') return 'Claude n’a pas réussi à lire cette annonce. Ajoute plus de texte.';
  if (c === 'refused') return 'Claude n’a pas pu traiter cette demande.';
  if (c === 'prompt_too_large') return 'Le texte est trop long : colle seulement l’annonce.';
  if (c === 'cancelled') return '';
  return 'Claude ne répond pas pour le moment. Réessaie.';
}
async function importListing() {
  if (!sample) return;
  const txt = ($('#imp-text') || {}).value || '';
  const file = state.importFile;
  const status = $('#imp-status'), btn = $('#imp-btn');
  if (!txt.trim() && !file) { status.textContent = 'Colle le texte de l’annonce ou ajoute une capture.'; return; }
  btn.disabled = true; status.textContent = 'Claude lit l’annonce…';
  const villes = state.market.villes.map(v => v.nom).join(', ');
  const prompt = `Tu lis une annonce immobilière française (texte et/ou capture d'écran). Extrais les informations et réponds uniquement avec un objet JSON de cette forme :
{"type": "maison", "appartement" ou "immeuble", "titre": "titre court, 2 à 6 mots, ex. Maison 4 pièces avec jardin", "defauts": liste de défauts ou travaux mentionnés dans l'annonce, en quelques mots chacun (ex. ["toiture à refaire", "humidité au sous-sol", "chauffage au fioul"]), [] si aucun, "ville": "nom de la commune", "prix": nombre en euros, "surface": nombre en m², "pieces": nombre, "dpe": "A" à "G" ou null, "meuble": true ou false, "loyer": loyer mensuel hors charges si le bien est vendu loué ou si un loyer est indiqué, sinon null, "charges": charges de copropriété ANNUELLES en euros ou null, "taxeFonciere": taxe foncière annuelle ou null, "travaux": montant de travaux annoncé ou null, "annee": année de construction ou null, "lien": URL de l'annonce si présente ou null}
Mets null quand l'information n'est pas dans l'annonce : ne devine pas. Si les charges sont mensuelles, multiplie-les par 12. Villes connues de l'application : ${villes}.
${txt.trim() ? 'Annonce :\n' + txt.trim().slice(0, 12000) : "L'annonce est dans la capture d'écran jointe."}`;
  try {
    const opts = {modelTier: 'quick'};
    if (file && state.imgAvailable) opts.images = [file];
    const j = await sample.json(prompt, opts);
    if (!j || typeof j !== 'object') throw {code: 'invalid_json'};
    const d = Object.assign({}, EMPTY_DRAFT);
    const setN = k => { const n = num(j[k]); if (n != null && n >= 0) d[k] = String(n); };
    ['prix', 'surface', 'pieces', 'loyer', 'charges', 'taxeFonciere', 'travaux', 'annee'].forEach(setN);
    if (typeof j.titre === 'string') d.titre = j.titre.slice(0, 80);
    d.type = typeof j.type === 'string' && TYPES[j.type.trim().toLowerCase()] ? j.type.trim().toLowerCase() : inferType(d.titre);
    if (Array.isArray(j.defauts)) d.defauts = j.defauts.filter(x => typeof x === 'string' && x.trim()).slice(0, 12).map(x => x.trim().slice(0, 120)).join('\n');
    if (typeof j.dpe === 'string' && /^[A-G]$/i.test(j.dpe.trim())) d.dpe = j.dpe.trim().toUpperCase();
    d.meuble = j.meuble === true;
    if (typeof j.lien === 'string' && safeUrl(j.lien)) d.lien = safeUrl(j.lien);
    if (typeof j.ville === 'string' && j.ville.trim()) {
      const c = findCity({villeNom: j.ville}, state.market);
      if (c) d.ville = c.id; else { d.ville = 'autre'; d.villeNom = j.ville.trim().slice(0, 60); }
    }
    state.draft = d; state.editingId = null; state.importFile = null; persistDraft();
    render({force: true});
    const s2 = $('#imp-status'); if (s2) s2.textContent = 'Formulaire rempli. Vérifie les chiffres puis enregistre.';
    toast('Annonce importée');
  } catch (e) {
    const m = aiErr(e);
    const s2 = $('#imp-status'); if (s2) s2.textContent = m;
    const b2 = $('#imp-btn'); if (b2) b2.disabled = false;
    if (!state.aiAvailable) render({force: true});
  }
}

  const r = analyze(raw, state.settings, state.market), o = r.o;
  state.ai[id] = {status: 'loading', text: ''}; render({force: true});
  const data = {
    typeDeBien: TYPES[o.type], titre: o.titre, ville: cityName(r), prix: o.prix, surface: o.surface, dpe: o.dpe || 'inconnu', location: o.meuble ? 'meublée' : 'nue',
    defautsConnus: r.defauts.map(x => x.titre),
    loyerMensuel: o.loyer, valeursEstimees: o.estimes, chargesCoproAn: o.charges, taxeFonciere: o.taxeFonciere, travaux: o.travaux, anneeConstruction: o.annee,
    prixM2: Math.round(r.prixM2), prixM2MoyenVille: r.city ? r.city.prixM2 : null, encadrementLoyers: r.city ? r.city.encadrement : null,
    apport: r.apport, emprunt: Math.round(r.emprunt), tauxCredit: state.settings.taux, dureeAns: state.settings.duree,
    rendementBrut: +(r.rendBrut * 100).toFixed(2), rendementNet: +(r.rendNet * 100).toFixed(2), cashflowMensuelApresImpot: Math.round(r.cashMensuel),
    regimeFiscal: REGIMES[r.regime], rentableEnAnnees: r.rentable == null ? 'pas sur 30 ans' : +r.rentable.toFixed(1), score: r.score,
    risques: r.risks.map(x => x.titre), notes: (raw.notes || '').slice(0, 1500)
  };
  const prompt = `Tu es analyste en investissement locatif en France, direct et prudent. Voici une offre analysée par l'application HomeIme (chiffres calculés avec les hypothèses de l'utilisateur).
Écris en français, en texte simple sans Markdown (pas de #, pas de **), 200 mots maximum, avec exactement ces rubriques, chacune sur sa propre ligne :
Synthèse : une ou deux phrases.
Points forts : 2 ou 3 puces commençant par « • ».
Points faibles : 2 ou 3 puces commençant par « • ».
Prix à proposer : une fourchette argumentée en euros.
Questions à poser : 3 puces commençant par « • ».
Termine par : « Analyse indicative, à vérifier avec un professionnel. »
Données : ${JSON.stringify(data)}`;
  try {
    const res = await sample(prompt, {onText: ({text}) => { state.ai[id].text = text; const el = $('#ai-out'); if (el) el.textContent = text; }});
    state.ai[id] = {status: 'done', text: res.text};
  } catch (e) {
    state.ai[id] = {status: 'error', text: e && e.text ? e.text : '', error: aiErr(e)};
  }
  render({force: true});
}

/* ---------- Événements ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const a = t.dataset.action;
  if (a === 'check') return; // géré par change
  if (a === 'sort') { state.sort = t.dataset.sort; render({force: true}); }
  else if (a === 'ask-delete') { state.confirm = 'del-' + t.dataset.id; render({force: true}); }
  else if (a === 'ask-delete-examples') { state.confirm = 'examples'; render({force: true}); }
  else if (a === 'ask-reset') { state.confirm = 'reset'; render({force: true}); }
  else if (a === 'cancel') { state.confirm = null; render({force: true}); }
  else if (a === 'delete') {
    const id = t.dataset.id; t.disabled = true;
    if (await removeOffer(id)) { toast('Offre supprimée'); location.hash = 'offres'; }
  }
  else if (a === 'delete-examples') {
    t.disabled = true;
    const ex = state.offers.filter(o => o.exemple);
    for (const o of ex) await removeOffer(o.id);
    state.confirm = null; toast('Exemples retirés'); render({force: true});
  }
  else if (a === 'remove-photo') {
    const d = ensureDraft(); d.photo = ''; d.photoCredit = ''; persistDraft();
    const row = $('#photo-row'); if (row) row.innerHTML = '';
    const input = $('#f-photo'); if (input) input.value = '';
  }
  else if (a === 'load-examples') {
    const now = new Date().toISOString();
    LOCAL_EXAMPLES.forEach(x => { if (!state.offers.some(o => o.id === x.id)) state.offers.push(Object.assign({}, x, {exemple: true, checks: [], source: 'exemple', lien: '', createdAt: now})); });
    lsWrite(); render({force: true});
  }
  else if (a === 'reset-settings') { state.settings = Object.assign({}, DEFAULT_SETTINGS); state.confirm = null; queueSave('settings'); render({force: true}); toast('Réglages par défaut rétablis'); }
  else if (a === 'edit') {
    const o = state.offers.find(x => x.id === t.dataset.id); if (!o) return;
    state.draft = draftFromOffer(o); state.editingId = o.id; persistDraft(); location.hash = 'analyser';
  }
  else if (a === 'cancel-edit') { const id = state.editingId; state.draft = Object.assign({}, EMPTY_DRAFT); state.editingId = null; persistDraft(); location.hash = id ? 'o-' + id : 'offres'; }
  else if (a === 'reset-form') { state.draft = Object.assign({}, EMPTY_DRAFT); state.editingId = null; state.importFile = null; persistDraft(); render({force: true}); }
  else if (a === 'use-rent') { ensureDraft().loyer = t.dataset.v; persistDraft(); const i = $('#f-loyer'); if (i) i.value = t.dataset.v; const p = $('#preview'); if (p) p.innerHTML = previewHTML(); }
  else if (a === 'simulate') {
    const c = state.market.villes.find(v => v.id === t.dataset.city); if (!c) return;
    state.draft = Object.assign({}, EMPTY_DRAFT, {titre: 'T2 type à ' + c.nom, ville: c.id, surface: '45', pieces: '2', prix: String(Math.round(c.prixM2 * 45 / 1000) * 1000)});
    state.editingId = null; persistDraft(); location.hash = 'analyser';
  }
  else if (a === 'save') {
    const d = ensureDraft();
    const prix = num(d.prix), surface = num(d.surface);
    if (!(prix > 0) || !(surface > 0)) { toast('Indique au moins le prix et la surface.'); const f = $(prix > 0 ? '#f-surface' : '#f-prix'); if (f) f.focus(); return; }
    const prevO = state.editingId ? state.offers.find(o => o.id === state.editingId) : null;
    const city = findCity(draftOffer(d), state.market);
    const o = {
      id: prevO ? prevO.id : uid(),
      titre: d.titre.trim() || ((num(d.pieces) ? 'T' + num(d.pieces) + ' ' : 'Bien ') + (city ? 'à ' + city.nom : '')).trim(),
      ville: city ? city.id : '', villeNom: city ? city.nom : (d.villeNom || '').trim(),
      region: city ? (cityRegion(city) || '') : (REGIONS.some(g => g.id === d.region) ? d.region : ''),
      prix, surface, pieces: num(d.pieces), dpe: d.dpe || null, meuble: !!d.meuble,
      loyer: num(d.loyer), charges: num(d.charges), taxeFonciere: num(d.taxeFonciere), travaux: num(d.travaux), annee: num(d.annee),
      lien: safeUrl(d.lien), notes: (d.notes || '').slice(0, 4000),
      type: TYPES[d.type] ? d.type : inferType(d.titre), defauts: splitLines(d.defauts),
      photo: safePhoto(d.photo), photoCredit: safePhoto(d.photo) ? String(d.photoCredit || '').slice(0, 120) : '',
      checks: prevO && prevO.checks ? prevO.checks : [], exemple: false,
      source: prevO && prevO.source ? prevO.source : 'manuel',
      createdAt: prevO && prevO.createdAt ? prevO.createdAt : new Date().toISOString()
    };
    t.disabled = true;
    if (await saveOffer(o)) {
      state.draft = Object.assign({}, EMPTY_DRAFT); state.editingId = null; persistDraft();
      toast(prevO ? 'Modifications enregistrées' : 'Offre enregistrée');
      location.hash = 'o-' + o.id;
    } else t.disabled = false;
  }
  else if (a === 'import') importListing();
  else if (a === 'ai') askClaude(t.dataset.id);
  else if (a === 'crit-city' || a === 'crit-region') {
    const key = a === 'crit-city' ? 'villes' : 'regions', id = a === 'crit-city' ? t.dataset.city : t.dataset.region;
    const list = (state.criteria[key] || []).slice(), i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1); else list.push(id);
    state.criteria = Object.assign({}, state.criteria, {[key]: list});
    queueSave('criteria'); render({force: true});
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.action === 'check') {
    const o = state.offers.find(x => x.id === t.dataset.id); if (!o) return;
    const set = new Set(o.checks || []); if (t.checked) set.add(t.dataset.key); else set.delete(t.dataset.key);
    const checks = Array.from(set);
    if (state.mode === 'db' && db) { try { await db.collection('offers').doc(o.id).update({checks}); } catch (err) { toast(writeErr(err)); t.checked = !t.checked; } }
    else { o.checks = checks; lsWrite(); }
    return;
  }
  if (t.id === 'f-photo-file') {
    const file = t.files && t.files[0];
    const status = $('#photo-status');
    if (!file || !state.assetsApi) return;
    if (file.size > 15 * 1024 * 1024) { if (status) status.textContent = 'Photo trop lourde (15 Mo maximum).'; return; }
    if (status) status.textContent = 'Envoi de la photo…';
    try {
      const res = await state.assetsApi.upload(file);
      const d = ensureDraft(); d.photo = res.url; d.photoCredit = 'Photo ajoutée par toi'; persistDraft();
      const row = $('#photo-row'); if (row) row.innerHTML = photoPreviewHTML(d);
      const input = $('#f-photo'); if (input) input.value = res.url;
      if (status) status.textContent = 'Photo ajoutée. Pense à enregistrer l’offre.';
    } catch (err) {
      if (status) status.textContent = 'Impossible d’envoyer la photo pour le moment. Réessaie.';
    }
    return;
  }
  if (t.id === 'imp-img') {
    state.importFile = t.files && t.files[0] ? t.files[0] : null;
    const lab = document.querySelector('label[for="imp-img"]'); if (lab) lab.textContent = state.importFile ? 'Capture ajoutée ✓' : 'Ajouter une capture';
    return;
  }
  onFormInput(e);
  onSettingInput(e, true);
});
document.addEventListener('input', e => { onFormInput(e); onSettingInput(e, false); });

function onFormInput(e) {
  const t = e.target;
  if (!t.form || t.form.id !== 'offer-form' || !t.name) return;
  const d = ensureDraft();
  if (t.type === 'radio' && e.type === 'input') return; // un choix est pris en compte à la validation
  if (t.name === 'meuble') d.meuble = t.value === '1';
  else d[t.name] = t.value;
  if (t.name === 'ville') { const box = $('#ville-autre'); if (box) box.hidden = t.value !== 'autre'; }
  persistDraft();
  const p = $('#preview'); if (p) p.innerHTML = previewHTML();
  if (['ville', 'villeNom', 'surface', 'meuble'].includes(t.name)) { const h = $('#rent-hint'); if (h) h.innerHTML = rentHint(); }
  if (t.name === 'photo') { d.photoCredit = ''; const row = $('#photo-row'); if (row) row.innerHTML = photoPreviewHTML(d); }
}
function onSettingInput(e, committed) {
  const t = e.target;
  if (!t.dataset || !t.dataset.set) return;
  const isSel = t.tagName === 'SELECT', isRadio = t.type === 'radio';
  if ((isSel || isRadio) && !committed) return; // un menu ou un choix est enregistré à la validation
  const k = t.dataset.key, obj = t.dataset.set;
  let v = isRadio ? t.value : isSel ? (isNaN(Number(t.value)) ? t.value : Number(t.value)) : num(t.value);
  if (v == null && obj === 'criteria' && String(t.value).trim() === '') v = 0;
  if (v == null) return;
  if (obj === 'settings') state.settings = Object.assign({}, state.settings, {[k]: v});
  else state.criteria = Object.assign({}, state.criteria, {[k]: v});
  queueSave(obj);
  if (obj === 'criteria' && state.route.view === 'rechercher') updateSearch();
}
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.classList.contains('ph')) {
    const box = t.parentElement;
    if (box && (box.classList.contains('o-photo') || box.classList.contains('d-photo'))) { box.classList.add('ph-missing'); t.remove(); }
    else t.style.visibility = 'hidden';
  }
}, true);
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('zone')) state.zoneOpen = e.target.open; }, true);

window.addEventListener('hashchange', () => { route(); render({force: true}); window.scrollTo(0, 0); });
route();
render({force: true});
connect();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
